name: L4 docs-audit

on:
  push:
    branches: [master, main]
    # v9.1.6 补：ci.yml 的 paths 是白名单（只含 lx-source.js / test / scripts / src / workflows），
    # docs/** 不在其中 —— 意味着纯文档提交过去既不走 ci.yml、也不走本 workflow，
    # 只能等每周一或人工手动触发。实测 cc26121→5c812c8 就是这么漏掉的（W2 红了一轮）。
    # 本 workflow 只跑 docs-audit（分钟级），专治这个盲区。回写提交已带 [skip ci] 防自触发。
    paths:
      - 'docs/**'
  schedule:
    # 每周一凌晨巡检：UTC 周日 18:15 = 北京时间周一 02:15（错开 probe 的 UTC 20:00）
    - cron: '15 18 * * 0'
  workflow_dispatch: {}   # 手动触发

jobs:
  docs-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 拉取兄弟仓（跨仓一致性校验）
        run: |
          rm -rf ../lx-music-mobile
          git clone --depth 1 --quiet https://github.com/luanmuc/mobile-app.git ../lx-music-mobile \
            || echo "::warning::兄弟仓 clone 失败，跨仓规则将跳过"
      - name: L4 文档一致性巡检（低风险自动修复）
        # 规则见 scripts/docs-audit.js（24 条）：版本串/冒烟组数/行段/开关真值/矩阵与台账/文档登记/缺陷编号/脚本索引/测试入口覆盖/README 产物字节数等
        # 报告项（不修改）：README_HEALTH 与 candidate-status 新鲜度（>28h 告警）
        run: node scripts/docs-audit.js
      - name: 修复写回（自动提交，无变化跳过）
        run: |
          git config user.name 'luanmuc[bot]'
          git config user.email 'luanmuc@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::无文档修复，跳过提交"
          else
            git commit -m "chore(docs): L4 文档巡检自动修复（docs-audit） [自动] [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: 红项硬失败（无法自动修复的不一致必须人工处理）
        run: |
          node scripts/docs-audit.js --dry-run > /tmp/audit.log 2>&1 || true
          if grep -q '🔴' /tmp/audit.log; then
            grep '🔴' /tmp/audit.log
            echo "::error::存在无法自动修复的文档不一致（上方 🔴）"
            exit 1
          fi
          echo "✅ 无红项"
