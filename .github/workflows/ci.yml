name: lx-source CI

on:
  push:
    branches: [master, main]
    paths:
      - 'lx-source.js'
      - 'test/**'
      - 'scripts/**'
      - 'src/**'
      - '.github/workflows/**'
  schedule:
    # v8.10.4：改到 UTC 20:00（北京次日 04:00）。GitHub schedule 排队实测延迟 6–8 小时
    # （原 UTC 06:00 设定的实际落地是北京 20:14 / 21:25 / 21:33 / 21:49 / 22:26），
    # 前移后实际落地约在北京上午 10–12 点，当天就能看到报告
    - cron: '0 20 * * *'
  workflow_dispatch: {}   # 手动触发（R75：docs-only 提交不会触发本 workflow，
                          # 而 App 的源仓 HEAD 闸门要求「最近一次 push CI」为绿，需要能手动补一次）
  # v4.0：发版后自动巡检，生成发布后基线健康表（含近7日成功率 + 死源建议）
  release:
    types: [published]

jobs:
  # 变更面判定：L1.3 压力测试（S1~S10，云端 8m36）只在「音源代码真变了」时才跑。
  # 只改 test/ scripts/ docs 时，被压的对象（lx-source.js / src）没变，跑一遍结论必然相同——跳过不丢覆盖。
  # schedule / workflow_dispatch / release 事件一律照跑（那是定期体检与发版验收）。
  changes:
    name: 变更面
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.diff.outputs.src }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: 判定 lx-source.js / src 是否变化
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="HEAD~1"; fi
          FILES=$(git diff --name-only "$BASE" "${{ github.sha }}" || git diff --name-only HEAD~1)
          echo "变更文件："; echo "$FILES" | sed 's/^/  /'
          if echo "$FILES" | grep -qE '^(lx-source.js|src/)'; then echo "src=true" >> "$GITHUB_OUTPUT"; else echo "src=false" >> "$GITHUB_OUTPUT"; fi
  # ---------- v2.0：语法 + 冒烟 + 审计（并行 job 1） ----------
  test-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: L0 语法检查
        run: node --check lx-source.js
      # v9.1.2（B03-003）：E0 契约面 / L 分层依赖 / C2 产物校验此前只在 v9-gate.sh 里，
      # ci.yml 从未调用 → 拆包分层退化与契约面漂移在 push 门禁上无人看守。三者零第三方依赖。
      - name: E0/L 门禁（契约面快照 + 分层依赖 + 产物校验）
        run: bash scripts/v9-gate.sh --group fast
      - name: E1 行为等价（抽样 100 例对齐基线）
        run: node scripts/equiv-snapshot.js --fast --sample 5
      # v9.1.2（B03-004）：跨仓 X/P 同构校验需要 App 仓。sparse 只取 3 个必要文件，
      # checkout 失败则跳过（不把网络/权限波动打成流水线红），成功则必须过。
      - name: 检出 App 仓（仅跨仓同构校验所需文件）
        id: app
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: luanmuc/mobile-app
          path: _app
          sparse-checkout: |
            src/core/init/userApi/builtinSource.ts
            src/core/healthDigest.ts
            android/app/src/main/assets/builtin_source.js
          sparse-checkout-cone-mode: false
      - name: X/P 跨仓同构（版本行正则 + healthDigest 四顶层键）
        if: ${{ steps.app.outcome == 'success' }}
        env:
          LX_APP_DIR: ${{ github.workspace }}/_app
        run: |
          node scripts/cross-repo-version.js
          node scripts/schema-parity.js
      - name: L1 冒烟测试（mock lx 宿主，67 组用例）
        run: node test/lx-source-smoke-test.js
      - name: L1.1 candidate-audit 专项测试（v8.1）
        run: node test/candidate-audit-test.js
      # v8.11：巡检时长判据自检——用构造的真实字节锁住解析器，防止被"简化"成只判状态码
      - name: L1.2 巡检交付时长判据自检（v8.11）
        run: node scripts/probe.js --selftest-duration
      # v5.0：发布前自检门——版本串同步/actions声明/README与ROADMAP同步，任一失败阻断
      - name: L2 发布前自检门（版本串/action声明/文档同步）
        run: node scripts/self-check.js
      # v8.11.2（G2）：QuickJS 真引擎。此前该入口在本地因缺依赖 SKIP、且从未进 CI，
      # QR 组 3 条断言长期空转（rec 里 id 未定义的 bug 也因此藏了很久）。
      - name: L5.2 QuickJS 真引擎（宿主无 Buffer，模拟 App 运行环境）
        run: |
          npm i quickjs-emscripten --no-save --silent
          NODE_PATH=./node_modules node test/audit/q-quickjs-real.js
      - name: 巡检脚本语法（v8.10.5：覆盖 scripts 下全部脚本，新增脚本自动纳入）
        run: |
          for f in scripts/*.js; do node --check "$f" || exit 1; done

  # ---------- 2026-11-21：审计门禁按「互不依赖」拆成两个并行 job ----------
  # 原来 5 个 L3/L4 step 串在 test-fast 里，合计约 106s，把 test-fast 拖到 2m34。
  # 它们彼此没有数据依赖（各自读源码跑断言），拆开后与 test-fast 并行，墙钟由最长者决定。
  audit-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # v8.11.2（G1）：审计脚本接入 CI。此前 7 个审计脚本只在本地跑，
      # 22 条 A 级断言（注入能红）从未守过任何一次提交。
      - name: L3 审计门禁（静态/逻辑/功能/扩展）
        run: |
          node test/audit/a-static.js
          node test/audit/b-logic.js
          node test/audit/d-func.js
          node test/audit/e-extra.js
      # 2026-11-19：剩余 24 个 audit 脚本接入 CI。此前 test/audit 下 43 个脚本里只接了 19 个，
      # 24 个（含 14 个 health-* 与 readthrough-fixes / y-provider-contract 等）从未在流水线里跑过。
      # 实测：24 个在干净环境（node_modules 为空）全部 exit 0，断言合计 222 条。
      - name: L4.1 审计门禁（健康状态族①：状态机/资格/权威/熔断/不变量/摘除/清账）
        run: |
          node test/audit/health-state-machine-v2.js
          node test/audit/health-eligibility-batch3.js
          node test/audit/health-authority-split.js
          node test/audit/health-breaker-quality.js
          node test/audit/health-linkage-invariants.js
          node test/audit/health-resolve-dead.js
          node test/audit/health-scoped-reset.js
      - name: L4.2 审计门禁（健康状态族②：探测/持久化/调度/快照/事件）
        run: |
          node test/audit/health-probe-batch2.js
          node test/audit/health-probe-fidelity.js
          node test/audit/health-probe-outcome.js
          node test/audit/health-persistence-v2.js
          node test/audit/health-scheduler-fake-clock.js
          node test/audit/health-snapshot-eta.js
          node test/audit/health-transition-events.js

  audit-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: L4 审计门禁（仓库/元审计/开关）
        run: |
          node test/audit/f-repo.js
          node test/audit/g-meta.js
          node test/audit/h-toggles.js
          node test/audit/n-fixes.js
          node test/audit/p-gaps.js
          node test/audit/q-dfix.js
          node test/audit/q2-dseries.js
          node test/audit/r-admission.js
          node test/audit/s-health-events.js
          node test/audit/t-health-events-stress.js
          node test/audit/u-cross-platform.js
          node test/audit/v-cross-platform-stress.js
          node test/audit/w-fallback-owner.js
          node test/audit/x-media-envelope.js
      - name: L4.3 审计门禁（质量/契约/生命周期/取消/预算/口径/通读回归）
        run: |
          node test/audit/quality-policy-v2.js
          node test/audit/quality-truth.js
          node test/audit/y-provider-contract.js
          node test/audit/s-source-lifecycle.js
          node test/audit/v-eligibility.js
          node test/audit/z-cancel.js
          node test/audit/aa-p3-persist.js
          node test/audit/budget-admission.js
          node test/audit/tg-truth.js
          node test/audit/readthrough-fixes.js

  # ---------- v8.11.1：长跑压力测试（并行 job 2，约 11 分钟，真实超时等待） ----------
  stress-long:
    runs-on: ubuntu-latest
    needs: [changes]
    # 音源代码没变时不为同一条结论重复烧 8 分钟；schedule/dispatch/release 永远跑
    if: needs.changes.outputs.src == 'true' || github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: L1.3 压力测试（v8.11.1，G1~G8 共 12 断言）
        run: node --expose-gc test/stress-test.js

  # ---------- v8.11：短压力与并发（并行 job 3） ----------
  stress-short:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: L5 第三轮压力与并发（T1~T12）
        run: node --expose-gc test/stress-round3.js
      - name: L5.1 第四轮压力测试（V 组 133 条：故障谱系/不变量/MISMATCH/阈值边界/配置面/兜底档实证）
        run: node --expose-gc test/stress-round4.js

  # ---------- v8.11.2（G1）：变异测试 ----------
  # v9.1.2（B05-003）：原来只在 schedule/dispatch 跑 —— push 引入的回归要等一周才可能被抓到，
  # 而 10 个默认门禁变异体没有任何第二道行为门禁兜底。现在 push（且 src 有变）也跑，
  # 但只跑 FAST_GATES 子集（5 个门禁，2~3 分钟）；schedule/dispatch 仍跑全量（含 SLOW_GATES）。
  mutation:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.src == 'true' || github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装构建依赖（变异测试需要 esbuild）
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 变异测试（push 跑 fast 子集，schedule/dispatch 跑全量 22 变异体）
        run: node test/mutation/run.js --strict ${{ github.event_name == 'push' && '--fast' || '--full' }}

  # ---------- v2.0：每日端点巡检 + 健康表写回 ----------
  probe:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'release' }}
    permissions:
      contents: write
      issues: write   # v8.10.5：巡检告警需创建 Issue（GitHub 会给 owner 发通知，这是唯一的推送通道）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 判否候选恢复探测（hyw/huanyin 触发式待办自动监控）
        # v8.10.5：不再 `|| true` 静默吞掉——失败仍不阻断巡检产物，但必须留下可见信号（V24）
        run: |
          node scripts/recheck-candidates.js || {
            echo "::warning::recheck-candidates 失败（不影响巡检产物）";
            echo "## ⚠️ 候选恢复探测失败" >> "$GITHUB_STEP_SUMMARY";
          }
      - name: 端点巡检（Range 判定）
        # v8.10.5：只放行 exit 2（= **所有**平台主路同时全挂，真紧急；仍需写回健康表留档）；其它非 0 说明脚本自己坏了，必须红（V23）
        run: |
          node scripts/probe.js --reps=3 --assert-samples; rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning::所有平台主路同时不可用（exit 2）——紧急，但仍写回健康表留档"
            echo "## ❌ 所有平台主路同时不可用" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$rc" -ne 0 ]; then echo "::error::probe 异常退出码 $rc"; exit "$rc"; fi
      - name: 拉取真机摘要（公开仓 lx-telemetry，只读）
        # v8.17 阶段 4：匿名 API 60 次/小时容易 403，这里用本 job 的 GITHUB_TOKEN 提额；
        # 失败不阻断（脚本自身已降级为 0 行 + warning，日报标注「今日无真机数据」）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pull-device-digests.js --days=14

      - name: 每日出链抽样（启用源各 1 首真实取链）
        # v8.17：补「端点活着 ≠ 能出链」。抽样失败不阻断巡检产物（只告警），因为
        # source-audit 本身可能受平台风控影响；但失败必须写进摘要，不能静默。
        run: |
          node scripts/chain-sample.js || {
            echo "::warning::出链抽样失败（不影响 probe 产物）";
            echo "## ⚠️ 出链抽样失败" >> "$GITHUB_STEP_SUMMARY";
          }

      - name: v8.0 健康日报生成（基于 probe-history 聚合）
        # v8.10.4：显式传北京日期。health-daily.js 默认用 new Date().toISOString()（恒 UTC），
        # runner 在 UTC 20:00 之后跑会跨日，导致日报文件名与用户所在日期差一天
        # v8.10.5：去掉 || true —— 日报生成失败必须让 job 变红（此前被吞，整条链路无任何信号，V1/V5）
        run: node scripts/health-daily.js --date $(TZ=Asia/Shanghai date +%F)
      - name: 仓库体积守卫（轻量：只告警，到阈值再归档）
        # v8.17：巡检产物是纯 JSONL，先设软阈值。probe-history 超 1MB 或单日增量 >200 行时告警，
        # 由维护者决定归档（不自动删，避免丢唯一证据）。
        run: |
          SZ=$(stat -c%s docs/probe-history.jsonl 2>/dev/null || echo 0)
          echo "probe-history: ${SZ} bytes"
          if [ "$SZ" -gt 1048576 ]; then
            echo "::warning::docs/probe-history.jsonl 已超 1MB（${SZ}B），按计划归档到 docs/archive/"
            echo "## ⚠️ 巡检历史超 1MB" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f docs/chain-sample.jsonl ]; then echo "chain-sample: $(stat -c%s docs/chain-sample.jsonl) bytes"; fi
          if [ -f docs/device-digests.jsonl ]; then echo "device-digests: $(stat -c%s docs/device-digests.jsonl) bytes"; fi

      - name: 健康表写回（自动提交）
        run: |
          git config user.name 'luanmuc[bot]'
          git config user.email 'luanmuc@users.noreply.github.com'
          # v9.1.4：改为 `git add docs/` 整目录，不再逐文件列举。
          # 逐文件清单每加一个巡检产物就要手改一次，v8.0 就漏过 README.md（V14/V15）。
          # docs/ 是巡检产物的唯一落点，整目录收口不会漏；README_HEALTH/README 单独补上。
          git add README_HEALTH.md README.md docs/
          git commit -m "chore(probe): 每日端点巡检刷新健康表+历史记录+v8.0健康日报 [自动]" -q || echo "健康表无变化，跳过提交"
          # v8.13.2（S-01）：巡检产物是发布/健康判定的依据，push 失败必须让 job 红。
          # 此前只写 warning + step summary，run 仍绿，等于静默丢失健康表。
          # v8.14.1：release 事件 checkout 在 tag 上，GITHUB_REF_NAME 是 tag；直接 push 会因
          # tag 已存在被拒。tag 引用（release 或按 tag 手动触发）统一 rebase 到 master 再写回分支。
          TARGET_REF="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${GITHUB_EVENT_NAME}" = "release" ]; then TARGET_REF="master"; fi
          if ! git fetch origin "${TARGET_REF}" || ! git rebase "origin/${TARGET_REF}"; then
            echo "::error::巡检产物 rebase 到 ${TARGET_REF} 失败；本次 run 判失败"
            echo "## ❌ 巡检产物 rebase 失败" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! git push origin "HEAD:${TARGET_REF}"; then
            echo "::error::自动提交 push 失败（无权限/远端已更新）；巡检产物未写入仓库，本次 run 判失败"
            echo "## ❌ 巡检产物 push 失败" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 巡检告警（滚动 Issue：需处理非空则更新，全部恢复则自动关闭）
        # v8.17：原实现按天开新 Issue，恢复后不关，通知会越积越多。
        # 改为单一「巡检告警·持续跟踪」：非空→edit（无则 create）；为空→评论已恢复并 close。
        # Issues 不可用时仍降级为 step 失败（GitHub 邮件是唯一兜底通道）。
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DAY=$(TZ=Asia/Shanghai date +%F)
          TITLE='巡检告警·持续跟踪'
          F="docs/health-daily/${DAY}.json"
          [ -f "$F" ] || { echo "ℹ️ 无汇总文件，跳过告警"; exit 0; }
          node scripts/health-alert.js "$F" > /tmp/alert.body
          NUM=$(gh issue list --state open --search "${TITLE} in:title" --json number,title \
                 --jq ".[] | select(.title == \"${TITLE}\") | .number" 2>/dev/null | head -1)

          if [ ! -s /tmp/alert.body ]; then
            echo "✅ 需处理 0 条"
            if [ -n "$NUM" ]; then
              gh issue comment "$NUM" --body "✅ ${DAY}：需处理已清零，自动关闭。"
              gh issue close "$NUM" >/dev/null && echo "已自动关闭告警 Issue #$NUM"
            fi
            exit 0
          fi

          { echo "## ${DAY} 更新"; cat /tmp/alert.body; } > /tmp/alert.md
          { echo "## 巡检告警（${DAY}）"; cat /tmp/alert.md; } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file /tmp/alert.md >/dev/null && echo "✅ 已更新告警 Issue #$NUM"
          else
            gh issue create --title "$TITLE" --body-file /tmp/alert.md >/dev/null 2>/tmp/gh.err || {
              echo "⚠️ Issue 通道不可用："; cat /tmp/gh.err
              echo "→ 降级为失败通知（有意失败，用于触发 GitHub 邮件告警）"
              cat /tmp/alert.md
              exit 1
            }
            echo "✅ 已创建滚动告警 Issue"
          fi

          # 连续失败 ≥7 天 → 打 escalated 标签（标签不存在则先创建；失败不阻断）
          # v9.1.4：改读 consecutiveFailAll（全历史连续失败天数）。
          # 旧实现读 consecutiveFail，那是 7 天窗口内的计数 —— 最大只能是 7，与阈值刚好卡死，
          # 无法区分"刚好 7 天"和"已经连续挂了 20 天"。
          if DAY="${DAY}" node -e 'const s=require("./docs/health-daily/"+process.env.DAY+".json");process.exit((s.handle||[]).some(r=>(r.consecutiveFailAll ?? r.consecutiveFail)>=7)?0:1)' 2>/dev/null; then
            gh label create escalated --color B60205 --description "连续 7 天未恢复" >/dev/null 2>&1 || true
            [ -n "$NUM" ] && gh issue edit "$NUM" --add-label escalated >/dev/null 2>&1 || true
            echo "⚠️ 存在连续 ≥7 天未恢复项，已打 escalated 标签"
          fi

  # ---------- v7.0：每周生态扫描（pdone 健康表交叉，产出新候选/失效清单）----------
  ecosystem:
    runs-on: ubuntu-latest
    # v8.10.4 更正：原注释写「每周一跑一次」，但 if 只判断 event_name、没有按星期过滤，
    # 实际每次 schedule（即每天）都会跑。行为保留（每天交叉扫描成本低、能更早发现失效），注释改为事实描述
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 生态扫描（pdone 健康表交叉）
        # v8.10.5：失败不再只 echo 一句就过——写进 job 摘要，Actions 页面能直接看到（V24）
        run: |
          node scripts/ecosystem-scan.js || {
            echo "::warning::生态扫描失败（网络/pdone 不可达）";
            echo "## ⚠️ 生态扫描失败" >> "$GITHUB_STEP_SUMMARY";
          }

  # ---------- v9.3：发布包签名（ed25519） ----------
  # 只产出 artifact，不自动改 Release 资产：Release 是手工发版的，CI 擅自覆盖已发布的
  # 二进制会让「哪个包被签过」这件事失去可审计性。发版时把两个产物手动传上去。
  # 缺 LX_SIGNING_KEY 时**跳过签名**而不是产半成品——带无效签名的包比不签更糟（App 会拒收且难排查）。
  sign-release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && needs.test-fast.result == 'success' && needs.audit-a.result == 'success' && needs.audit-b.result == 'success' }}
    needs: [test-fast, audit-a, audit-b]
    permissions:
      contents: write   # B2：签好的 manifest 需提交回 master，App 双通道才能拉到同源的验签文件
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖（build-source 依赖 devDep esbuild，缺它直接 MODULE_NOT_FOUND）
        run: npm ci
      - name: 重新构建产物（确保签的是本次源码产物，不是仓库里的旧文件）
        run: node scripts/build-source.js
      - name: 签名（LX_SIGNING_KEY）
        env:
          LX_SIGNING_KEY: ${{ secrets.LX_SIGNING_KEY }}
          LX_KEY_ID: k1
        run: |
          if [ -z "$LX_SIGNING_KEY" ]; then
            if [ "${ALLOW_UNSIGNED:-0}" = "1" ]; then
              echo "::warning::ALLOW_UNSIGNED=1：显式跳过签名（不产出 sig / manifest，artifact 无签名）"
              echo "- signed: false（ALLOW_UNSIGNED=1 显式跳过）" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::未配置 LX_SIGNING_KEY（B03-002）：sign-release 的语义就是签名发布，缺密钥不能算成功"
            echo "  · 要发布签名产物：把 ed25519 私钥存进 repo secret LX_SIGNING_KEY"
            echo "  · 要临时跳过（fork/PR/无密钥环境）：显式设置 ALLOW_UNSIGNED=1"
            exit 1
          fi
          node scripts/sign-release.js --require-key
          # 用内置公钥自校验一次：签完立刻验，签坏比不签更容易排查
          node scripts/sign-release.js --verify --pub "MCowBQYDK2VwAyEA72onGCEiDfN+SQDOEHnqkqsIyl8G/ma7tgrRJvC71dQ="
          echo "## 发布包签名" >> "$GITHUB_STEP_SUMMARY"
          node -e "const m=require('./lx-source.js.manifest.json');console.log('- version: '+m.version+'\n- size: '+m.size+'\n- sha256: '+m.sha256+'\n- keyId: '+m.keyId)" >> "$GITHUB_STEP_SUMMARY"
      - name: 上传签名产物
        uses: actions/upload-artifact@v4
        with:
          name: source-release-signed
          path: |
            lx-source.js
            lx-source.js.sig
            lx-source.js.manifest.json
          if-no-files-found: warn
      - name: 同步 manifest 回 master（App 双通道验签依赖）
        # B2：App 的「更新音源」走 Contents API / jsDelivr 双通道拉脚本，验签要从同一通道
        # 拉 manifest；jsDelivr 不服务 Release assets，所以 manifest 必须进仓库。
        # 签名是确定性的（sign-release.js 不写 signedAt），同一份产物重跑不会产生 diff。
        if: ${{ hashFiles('lx-source.js.manifest.json') != '' }}
        run: |
          if ! git ls-files --error-unmatch lx-source.js.manifest.json >/dev/null 2>&1; then
            echo "::warning::manifest 尚未被 git 跟踪：请本地提交一次 lx-source.js.manifest.json，之后本步骤自动接管"
            exit 0
          fi
          if git diff --quiet -- lx-source.js.manifest.json; then
            echo "manifest 与仓库一致，无需提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lx-source.js.manifest.json
          git commit -m "chore(sign): 同步发布签名 manifest [skip ci]"
          # R73：sign-release 与 docs-audit workflow 会同时写 master，直推必被拒。
          # 实测 44924159855：docs-audit 先推了 bfdb804，本 job 的 push 报
          # `! [rejected] master -> master (fetch first)`，整条 CI 变红、manifest 没更新。
          # 与 probe 写回步骤（本文件 :296-302）同口径：rebase 到远端后再推，失败才判红。
          if ! git fetch origin master || ! git rebase origin/master; then
            echo "::error::manifest rebase 到 master 失败；本次 run 判失败"
            echo "## ❌ manifest rebase 失败" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! git push origin "HEAD:master"; then
            echo "::error::manifest 同步失败：App 端「更新音源」会因缺同源 manifest 而验签失败，请手工提交 lx-source.js.manifest.json"
            echo "## ❌ manifest push 失败" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ---------- v8.10.3：发版自动 purge jsDelivr CDN ----------
  # push master 或发版后立刻刷新 CDN 缓存，App 端检查更新马上能拉到最新版
  purge-cdn:
    runs-on: ubuntu-latest
    # always()：stress-long 在「只改 test/scripts/docs」时会被跳过，不能因此连带跳过 purge。
    # 真正的门槛写成 needs 结果判定——test-fast 与已跑的 stress 都必须 success。
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'release') && needs.test-fast.result == 'success' && (needs.stress-long.result == 'success' || needs.stress-long.result == 'skipped') && needs.stress-short.result == 'success' }}
    needs: [test-fast, audit-a, audit-b, stress-long, stress-short]   # 测试通过才 purge，避免坏版本污染 CDN
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # 只要上一个 commit，够 diff 用
      - name: purge jsDelivr CDN（lx-source.js / manifest 变更时）
        run: |
          # 两个文件必须同时刷新：只刷脚本会让「脚本是新的、manifest 还是旧的」，
          # App 端 sha256 校验直接拒（fail-closed），用户看到的是「检查更新失败」。
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E "^lx-source.js(\.manifest\.json)?$" || true)
          if [ -n "$CHANGED" ]; then
            echo "变更文件：$CHANGED"
            curl -s "https://purge.jsdelivr.net/gh/luanmuc/backend-api@master/lx-source.js" || true
            curl -s "https://purge.jsdelivr.net/gh/luanmuc/backend-api@master/lx-source.js.manifest.json" || true
            echo "✅ CDN 缓存已刷新（脚本 + manifest）"
          else
            echo "ℹ️ lx-source.js / manifest 无变更，跳过 CDN purge"
          fi
