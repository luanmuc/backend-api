name: lx-source CI

on:
  push:
    branches: [master, main]
    paths:
      - 'lx-source.js'
      - 'test/**'
      - 'scripts/**'
      - '.github/workflows/**'
  schedule:
    # v8.10.4：改到 UTC 20:00（北京次日 04:00）。GitHub schedule 排队实测延迟 6–8 小时
    # （原 UTC 06:00 设定的实际落地是北京 20:14 / 21:25 / 21:33 / 21:49 / 22:26），
    # 前移后实际落地约在北京上午 10–12 点，当天就能看到报告
    - cron: '0 20 * * *'
  workflow_dispatch: {}   # 手动触发
  # v4.0：发版后自动巡检，生成发布后基线健康表（含近7日成功率 + 死源建议）
  release:
    types: [published]

jobs:
  # ---------- v2.0：语法 + 冒烟测试 ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: L0 语法检查
        run: node --check lx-source.js
      - name: L1 冒烟测试（mock lx 宿主，67 组用例）
        run: node test/lx-source-smoke-test.js
      - name: L1.1 candidate-audit 专项测试（v8.1）
        run: node test/candidate-audit-test.js
      # v8.11：巡检时长判据自检——用构造的真实字节锁住解析器，防止被"简化"成只判状态码
      - name: L1.2 巡检交付时长判据自检（v8.11）
        run: node scripts/probe.js --selftest-duration
      # v8.11.1：压力测试固化——档位矩阵/30并发/探针故障注入/边界输入/长跑泄漏/兜底/冷却误伤
      - name: L1.3 压力测试（v8.11.1，G1~G8 共 32 断言）
        run: node --expose-gc test/stress-test.js
      # v5.0：发布前自检门——版本串同步/actions声明/README与ROADMAP同步，任一失败阻断
      - name: L2 发布前自检门（版本串/action声明/文档同步）
        run: node scripts/self-check.js
      # v8.11.2（G1）：审计脚本接入 CI。此前 7 个审计脚本只在本地跑，
      # 22 条 A 级断言（注入能红）从未守过任何一次提交。
      - name: L3 审计门禁（静态/逻辑/功能/扩展）
        run: |
          node test/audit/a-static.js
          node test/audit/b-logic.js
          node test/audit/d-func.js
          node test/audit/e-extra.js
      - name: L4 审计门禁（仓库/元审计/开关）
        run: |
          node test/audit/f-repo.js
          node test/audit/g-meta.js
          node test/audit/h-toggles.js
      - name: L5 第三轮压力与并发（T1~T12）
        run: node --expose-gc test/stress-round3.js
      - name: L5.1 第四轮压力测试（V 组 133 条：故障谱系/不变量/MISMATCH/阈值边界/配置面/兜底档实证）
        run: node --expose-gc test/stress-round4.js
      # v8.11.2（G2）：QuickJS 真引擎。此前该入口在本地因缺依赖 SKIP、且从未进 CI，
      # QR 组 3 条断言长期空转（rec 里 id 未定义的 bug 也因此藏了很久）。
      - name: L5.2 QuickJS 真引擎（宿主无 Buffer，模拟 App 运行环境）
        run: |
          npm i quickjs-emscripten --no-save --silent
          NODE_PATH=./node_modules node test/audit/q-quickjs-real.js
      - name: 巡检脚本语法（v8.10.5：覆盖 scripts 下全部脚本，新增脚本自动纳入）
        run: |
          for f in scripts/*.js; do node --check "$f" || exit 1; done

  # ---------- v8.11.2（G1）：变异测试（只跑夜间与手动触发，全量 3~6 分钟） ----------
  mutation:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 变异测试（21 变异体，killed 率必须 100%）
        run: node test/mutation/run.js --full

  # ---------- v2.0：每日端点巡检 + 健康表写回 ----------
  probe:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'release' }}
    permissions:
      contents: write
      issues: write   # v8.10.5：巡检告警需创建 Issue（GitHub 会给 owner 发通知，这是唯一的推送通道）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 判否候选恢复探测（hyw/huanyin 触发式待办自动监控）
        # v8.10.5：不再 `|| true` 静默吞掉——失败仍不阻断巡检产物，但必须留下可见信号（V24）
        run: |
          node scripts/recheck-candidates.js || {
            echo "::warning::recheck-candidates 失败（不影响巡检产物）";
            echo "## ⚠️ 候选恢复探测失败" >> "$GITHUB_STEP_SUMMARY";
          }
      - name: 端点巡检（Range 判定）
        # v8.10.5：只放行 exit 2（= **所有**平台主路同时全挂，真紧急；仍需写回健康表留档）；其它非 0 说明脚本自己坏了，必须红（V23）
        run: |
          node scripts/probe.js; rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning::所有平台主路同时不可用（exit 2）——紧急，但仍写回健康表留档"
            echo "## ❌ 所有平台主路同时不可用" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$rc" -ne 0 ]; then echo "::error::probe 异常退出码 $rc"; exit "$rc"; fi
      - name: v8.0 健康日报生成（基于 probe-history 聚合）
        # v8.10.4：显式传北京日期。health-daily.js 默认用 new Date().toISOString()（恒 UTC），
        # runner 在 UTC 20:00 之后跑会跨日，导致日报文件名与用户所在日期差一天
        # v8.10.5：去掉 || true —— 日报生成失败必须让 job 变红（此前被吞，整条链路无任何信号，V1/V5）
        run: node scripts/health-daily.js --date $(TZ=Asia/Shanghai date +%F)
      - name: 健康表写回（自动提交）
        run: |
          git config user.name 'luanmuc[bot]'
          git config user.email 'luanmuc@users.noreply.github.com'
          # v8.10.5：补 README.md —— probe 每天整段重写其中「音源可用性」表格，此前不在 add 清单里等于白写（V14/V15）
          git add README_HEALTH.md README.md docs/probe-history.jsonl docs/health-daily/ docs/candidate-status.md
          git commit -m "chore(probe): 每日端点巡检刷新健康表+历史记录+v8.0健康日报 [自动]" -q || echo "健康表无变化，跳过提交"
          git push origin HEAD:${GITHUB_REF_NAME} || {
            echo "::warning::自动提交 push 失败（无权限/远端已更新），巡检产物只在本次 run 日志里，仓库内不会更新";
            echo "## ⚠️ 巡检产物 push 失败" >> "$GITHUB_STEP_SUMMARY";
          }

      - name: 巡检告警（需处理项非空才开 Issue，避免刷屏）
        # v8.10.5：日报此前只写入仓库、无任何通知，等于档案。这里把"需处理"变成一条 GitHub Issue，
        # 由 GitHub 通知 owner。限定：仅 schedule/dispatch；同一日期已有未关闭 Issue 则跳过。
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DAY=$(TZ=Asia/Shanghai date +%F)
          F="docs/health-daily/${DAY}.json"
          [ -f "$F" ] || { echo "ℹ️ 无汇总文件，跳过告警"; exit 0; }
          node scripts/health-alert.js "$F" > /tmp/alert.md
          if [ ! -s /tmp/alert.md ]; then echo "✅ 需处理 0 条，不告警"; exit 0; fi
          # 1) 先写进本次 run 的摘要页（Actions 页面直接可见，不依赖仓库功能开关）
          { echo "## 巡检告警"; cat /tmp/alert.md; } >> "$GITHUB_STEP_SUMMARY"

          # 2) Issues 通道：本仓实测 Issues 功能是关闭的（gh 报 "repository has disabled issues"），
          #    所以这里做两级降级——Issues 可用则开 Issue（可讨论、可关闭、有邮件）；
          #    不可用则**有意让本 step 失败**，靠 GitHub 的 job 失败邮件把告警推给 owner。
          #    注意：失败发生在本 job 末尾，此前的巡检产物提交已完成，不影响数据落库。
          if gh issue list --state open --search "巡检告警 ${DAY} in:title" --json number -q '.[].number' 2>/dev/null | grep -q .; then
            echo "ℹ️ 今日告警 Issue 已存在，跳过（不重复刷）"; exit 0
          fi
          if gh issue create --title "[巡检告警] ${DAY}" --body-file /tmp/alert.md 2>/tmp/gh.err; then
            echo "✅ 已创建告警 Issue"
          else
            echo "⚠️ Issue 通道不可用："; cat /tmp/gh.err
            echo "→ 降级为失败通知（这是有意失败，用于触发 GitHub 邮件告警）"
            cat /tmp/alert.md
            exit 1
          fi

  # ---------- v7.0：每周生态扫描（pdone 健康表交叉，产出新候选/失效清单）----------
  ecosystem:
    runs-on: ubuntu-latest
    # v8.10.4 更正：原注释写「每周一跑一次」，但 if 只判断 event_name、没有按星期过滤，
    # 实际每次 schedule（即每天）都会跑。行为保留（每天交叉扫描成本低、能更早发现失效），注释改为事实描述
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 生态扫描（pdone 健康表交叉）
        # v8.10.5：失败不再只 echo 一句就过——写进 job 摘要，Actions 页面能直接看到（V24）
        run: |
          node scripts/ecosystem-scan.js || {
            echo "::warning::生态扫描失败（网络/pdone 不可达）";
            echo "## ⚠️ 生态扫描失败" >> "$GITHUB_STEP_SUMMARY";
          }

  # ---------- v8.10.3：发版自动 purge jsDelivr CDN ----------
  # push master 或发版后立刻刷新 CDN 缓存，App 端检查更新马上能拉到最新版
  purge-cdn:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'release' }}
    needs: test   # 测试通过才 purge，避免坏版本污染 CDN
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # 只要上一个 commit，够 diff 用
      - name: purge jsDelivr CDN（仅 lx-source.js 变更时）
        run: |
          # 只在 lx-source.js 真正变更时才 purge，改 CI 配置不刷新缓存
          if git diff --name-only HEAD~1 HEAD | grep -q "^lx-source.js$"; then
            curl -s "https://purge.jsdelivr.net/gh/luanmuc/backend-api@master/lx-source.js" || true
            echo "✅ CDN 缓存已刷新"
          else
            echo "ℹ️ lx-source.js 无变更，跳过 CDN purge"
          fi
